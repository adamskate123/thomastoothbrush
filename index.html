<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Toothbrush">
<meta name="theme-color" content="#7fd8f7">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<title>Thomas's Toothbrush Timer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: ui-rounded, "SF Pro Rounded", "Hiragino Maru Gothic ProN", "Comic Sans MS", "Comic Sans", sans-serif;
    background: linear-gradient(180deg, #7fd8f7 0%, #b6f0e3 60%, #d8f7c9 100%);
    color: #24425c;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
    position: fixed;
    inset: 0;
  }

  .screen {
    display: none;
    position: absolute;
    inset: 0;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: max(12px, env(safe-area-inset-top)) 16px max(12px, env(safe-area-inset-bottom));
    text-align: center;
  }
  .screen.active { display: flex; }

  h1 { font-size: clamp(1.6rem, 5vw, 2.6rem); margin-bottom: 4px; }
  .subtitle { font-size: clamp(1rem, 3vw, 1.4rem); opacity: .8; margin-bottom: 18px; }

  .big-btn {
    font-family: inherit;
    font-size: clamp(1.4rem, 5vw, 2.2rem);
    font-weight: 700;
    color: #fff;
    background: linear-gradient(180deg, #ff9f43, #ff7846);
    border: none;
    border-radius: 60px;
    padding: 22px 54px;
    box-shadow: 0 8px 0 #d95d2f, 0 12px 24px rgba(0,0,0,.18);
    cursor: pointer;
    transition: transform .1s ease;
  }
  .big-btn:active { transform: translateY(5px); box-shadow: 0 3px 0 #d95d2f; }

  #muteBtn {
    position: absolute;
    top: max(14px, env(safe-area-inset-top));
    right: 16px;
    z-index: 50;
    font-size: 1.6rem;
    width: 56px; height: 56px;
    border-radius: 50%;
    border: none;
    background: rgba(255,255,255,.75);
    box-shadow: 0 3px 8px rgba(0,0,0,.15);
    cursor: pointer;
  }

  /* ---------- user select ---------- */
  #usersTooth { width: min(24vw, 16vh, 130px); margin-bottom: 6px; animation: bob 2.4s ease-in-out infinite; }
  @keyframes bob { 0%,100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-12px) rotate(3deg); } }
  #userGrid {
    display: flex;
    flex-wrap: wrap;
    gap: clamp(18px, 4vw, 36px);
    justify-content: center;
    align-items: flex-start;
    max-width: 760px;
    margin-top: 18px;
  }
  .user-bubble {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    border: none;
    background: none;
    cursor: pointer;
    font-family: inherit;
    color: inherit;
    touch-action: manipulation;
    -webkit-touch-callout: none;
  }
  .avatar-circle {
    position: relative;
    width: clamp(96px, 18vmin, 140px);
    height: clamp(96px, 18vmin, 140px);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(48px, 9vmin, 72px);
    box-shadow: 0 6px 14px rgba(0,0,0,.15), inset 0 -6px 0 rgba(0,0,0,.08);
    transition: transform .1s ease;
  }
  .user-bubble:active .avatar-circle { transform: scale(.93); }
  .user-bubble .uname { font-size: clamp(1.05rem, 3.5vmin, 1.4rem); font-weight: 700; }
  .count-badge {
    position: absolute;
    top: -4px;
    right: -10px;
    background: #fff;
    border-radius: 30px;
    padding: 4px 10px;
    font-size: .95rem;
    font-weight: 800;
    box-shadow: 0 2px 6px rgba(0,0,0,.2);
  }
  .plus-bubble .avatar-circle {
    background: rgba(255,255,255,.55);
    border: 4px dashed #6fb8d9;
    color: #3d7ea6;
    box-shadow: none;
  }

  /* ---------- add/edit user ---------- */
  #nameInput {
    font-family: inherit;
    font-size: clamp(1.3rem, 4.5vmin, 1.8rem);
    font-weight: 700;
    text-align: center;
    color: #24425c;
    background: rgba(255,255,255,.85);
    border: 3px solid #6fb8d9;
    border-radius: 40px;
    padding: 12px 20px;
    width: min(80vw, 340px);
    outline: none;
    user-select: text;
    -webkit-user-select: text;
  }
  #nameInput:focus { border-color: #ff9f43; }
  .picker-label { margin: 16px 0 8px; font-size: clamp(1rem, 3vmin, 1.25rem); font-weight: 700; opacity: .75; }
  #emojiGrid, #colorGrid { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; max-width: 580px; }
  .emoji-opt {
    font-family: inherit;
    font-size: clamp(1.7rem, 6vmin, 2.4rem);
    width: clamp(56px, 10vmin, 72px);
    height: clamp(56px, 10vmin, 72px);
    border-radius: 50%;
    border: 3px solid transparent;
    background: rgba(255,255,255,.6);
    cursor: pointer;
    padding: 0;
  }
  .color-opt {
    width: clamp(44px, 8vmin, 56px);
    height: clamp(44px, 8vmin, 56px);
    border-radius: 50%;
    border: 3px solid rgba(0,0,0,.08);
    cursor: pointer;
    padding: 0;
  }
  .emoji-opt.selected, .color-opt.selected {
    border-color: #24425c;
    box-shadow: 0 0 0 4px rgba(255,255,255,.9), 0 0 0 7px #ff9f43;
  }
  #editBtns { display: flex; flex-direction: column; align-items: center; gap: 12px; margin-top: 22px; }
  .small-btn { box-shadow: 0 3px 8px rgba(0,0,0,.12); }
  .small-btn.danger { background: #ff6b6b; color: #fff; }
  .small-btn.danger.confirm { background: #d63031; }
  .back-btn {
    position: absolute;
    top: max(14px, env(safe-area-inset-top));
    left: 16px;
    z-index: 50;
    font-size: 1.5rem;
    font-weight: 800;
    color: #24425c;
    width: 56px; height: 56px;
    border-radius: 50%;
    border: none;
    background: rgba(255,255,255,.75);
    box-shadow: 0 3px 8px rgba(0,0,0,.15);
    cursor: pointer;
    font-family: inherit;
  }

  /* ---------- start screen ---------- */
  #startAvatar { margin-bottom: 14px; animation: bob 2.4s ease-in-out infinite; }

  /* ---------- brushing screen ---------- */
  #screen-brush { justify-content: space-between; gap: 6px; }

  #brushHeader {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
    width: 100%;
    max-width: 700px;
    flex: 0 0 auto;
    padding-top: 4px;
  }
  #timerWrap { position: relative; width: clamp(84px, 16vmin, 130px); height: clamp(84px, 16vmin, 130px); flex: 0 0 auto; }
  #timerWrap svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  #ringBg { fill: none; stroke: rgba(255,255,255,.6); stroke-width: 10; }
  #ringFg { fill: none; stroke: #ff7846; stroke-width: 10; stroke-linecap: round; transition: stroke-dashoffset .3s linear; }
  #timeText {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: clamp(1.3rem, 4vmin, 2rem);
    font-weight: 800;
    font-variant-numeric: tabular-nums;
  }

  #message { flex: 0 1 auto; min-width: 0; }
  #msgQuad { font-size: clamp(1.4rem, 5.5vmin, 2.4rem); font-weight: 800; }
  #msgSurface {
    font-size: clamp(1.05rem, 4vmin, 1.6rem);
    margin-top: 4px;
    background: rgba(255,255,255,.7);
    border-radius: 30px;
    padding: 6px 18px;
    display: inline-block;
  }
  .pop { animation: pop .45s ease; }
  @keyframes pop { 0% { transform: scale(.6); } 60% { transform: scale(1.15); } 100% { transform: scale(1); } }

  #mouthBox { flex: 1 1 auto; width: 100%; display: flex; align-items: center; justify-content: center; min-height: 0; }
  #mouthSvg { width: auto; height: 100%; max-width: 96vw; max-height: 100%; }

  /* teeth: white tooth, gloss, plaque overlay, crisp outline */
  .tooth { fill: #ffffff; }
  .tooth-shine { fill: #ffffff; opacity: .8; }
  .tooth-outline { fill: none; stroke: #d5dde6; stroke-width: 2; stroke-linejoin: round; }
  .plaque { fill: url(#plaquePat); transition: opacity .5s ease; }

  /* quadrant highlight: pulsing opacity on a soft gradient (cheap on iPad,
     unlike animating a drop-shadow filter, which re-rasterizes every frame) */
  .quad-glow { fill: url(#glowGrad); opacity: 0; transition: opacity .45s ease; }
  .quad.active .quad-glow { animation: glowPulse 1.8s ease-in-out infinite; }
  @keyframes glowPulse { 0%,100% { opacity: .2; } 50% { opacity: .48; } }

  .quad-star { font-size: 34px; opacity: 0; transition: opacity .3s ease; }
  .quad-star.on { opacity: 1; animation: starPop .6s ease; }
  @keyframes starPop { 0% { transform: scale(0) rotate(-90deg); } 70% { transform: scale(1.4); } 100% { transform: scale(1); } }

  /* brush: positioned from JS each frame, so no CSS transition here */
  #brush { transform-box: view-box; transform-origin: 0 0; will-change: transform; }
  #brushInner { animation: scrub .5s ease-in-out infinite; }
  @keyframes scrub {
    0%   { transform: translate(0px, 0px); }
    25%  { transform: translate(5px, -4px); }
    50%  { transform: translate(0px, -8px); }
    75%  { transform: translate(-5px, -4px); }
    100% { transform: translate(0px, 0px); }
  }
  .bristle { animation: bristleFlex .5s ease-in-out infinite; }
  @keyframes bristleFlex { 0%,100% { transform: translateY(0); } 50% { transform: translateY(2.5px); } }

  /* particle effects (foam, bubbles, sparkles) — pooled, animated from JS */
  #fx > * { transform-box: view-box; transform-origin: 0 0; pointer-events: none; }

  /* face */
  .lid { animation: blink 5.4s ease-in-out infinite; }
  @keyframes blink { 0%, 92%, 100% { transform: translateY(0); } 96% { transform: translateY(66px); } }
  .eye-white, .eye-ball, .eye-happy { transition: opacity .25s ease; }
  .eye-happy { opacity: 0; }
  .brow { transition: transform .3s ease; }
  #mouthSvg.happy .eye-white, #mouthSvg.happy .eye-ball { opacity: 0; }
  #mouthSvg.happy .eye-happy { opacity: 1; }
  #mouthSvg.happy .brow { transform: translateY(-7px); }

  .paused #brushInner,
  .paused .bristle,
  .paused .lid,
  .paused .quad.active .quad-glow { animation-play-state: paused; }

  /* progress row */
  #progressRow { display: flex; gap: clamp(10px, 4vw, 28px); flex: 0 0 auto; padding-bottom: 6px; }
  .prog {
    width: clamp(48px, 10vmin, 68px); height: clamp(48px, 10vmin, 68px);
    border-radius: 50%;
    background: rgba(255,255,255,.7);
    display: flex; align-items: center; justify-content: center;
    font-size: clamp(1.5rem, 6vmin, 2.2rem);
    box-shadow: 0 3px 6px rgba(0,0,0,.12);
    transition: background .3s ease;
  }
  .prog.active { background: #ffd93d; animation: bounce .7s ease-in-out infinite; }
  .prog.done { background: #b8f2c9; }
  @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

  /* pause overlay */
  #pauseOverlay {
    display: none;
    position: absolute; inset: 0;
    background: rgba(36, 66, 92, .55);
    z-index: 40;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    color: #fff;
  }
  #pauseOverlay.show { display: flex; }
  #pauseOverlay h2 { font-size: clamp(1.6rem, 6vw, 2.6rem); }
  #pauseOverlay p { font-size: clamp(1.1rem, 4vw, 1.5rem); }
  .small-btn {
    font-family: inherit;
    font-size: clamp(1rem, 3.5vw, 1.3rem);
    font-weight: 700;
    color: #24425c;
    background: rgba(255,255,255,.92);
    border: none;
    border-radius: 40px;
    padding: 12px 28px;
    cursor: pointer;
  }

  /* ---------- celebration ---------- */
  #doneTooth { width: min(40vw, 28vh, 240px); margin-bottom: 10px; animation: partyBob 1s ease-in-out infinite; }
  @keyframes partyBob { 0%,100% { transform: rotate(-6deg) scale(1); } 50% { transform: rotate(6deg) scale(1.08); } }
  #confetti { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
  .confetto { position: absolute; top: -30px; animation: fall linear forwards; }
  .confetto.square { width: 12px; height: 12px; border-radius: 3px; }
  .confetto.emoji { font-size: 24px; }
  @keyframes fall {
    0%   { transform: translateY(-30px) rotate(0deg); opacity: 1; }
    100% { transform: translateY(110vh) rotate(720deg); opacity: .9; }
  }
</style>
</head>
<body>

<button id="muteBtn" aria-label="Toggle sound">🔊</button>

<!-- ================= CHOOSE USER ================= -->
<div id="screen-users" class="screen active">
  <svg id="usersTooth" viewBox="0 0 120 120" aria-hidden="true">
    <path d="M60 8 C34 8 20 26 20 46 c0 16 6 24 10 40 c3 12 5 26 14 26 c10 0 6-22 16-22 s6 22 16 22 c9 0 11-14 14-26 c4-16 10-24 10-40 C100 26 86 8 60 8 Z"
          fill="#ffffff" stroke="#cdd9e5" stroke-width="4"/>
    <circle cx="45" cy="46" r="5" fill="#24425c"/>
    <circle cx="75" cy="46" r="5" fill="#24425c"/>
    <path d="M44 62 Q60 76 76 62" fill="none" stroke="#24425c" stroke-width="4" stroke-linecap="round"/>
    <circle cx="34" cy="58" r="6" fill="#ffb3c1" opacity=".8"/>
    <circle cx="86" cy="58" r="6" fill="#ffb3c1" opacity=".8"/>
    <path d="M88 20 l3 7 7 3 -7 3 -3 7 -3-7 -7-3 7-3 Z" fill="#ffd93d"/>
  </svg>
  <h1>Who's brushing?</h1>
  <p class="subtitle" id="usersHint">Tap the + to add a brusher!</p>
  <div id="userGrid"></div>
</div>

<!-- ================= ADD / EDIT USER ================= -->
<div id="screen-edituser" class="screen">
  <h1 id="editTitle">New brusher</h1>
  <p class="picker-label">What's your name?</p>
  <input id="nameInput" type="text" maxlength="12" placeholder="Name" autocomplete="off" autocapitalize="words" enterkeyhint="done">
  <p class="picker-label">Pick your character</p>
  <div id="emojiGrid"></div>
  <p class="picker-label">Pick a color</p>
  <div id="colorGrid"></div>
  <div id="editBtns">
    <button id="saveUserBtn" class="big-btn">Save</button>
    <button id="cancelUserBtn" class="small-btn">Cancel</button>
    <button id="deleteUserBtn" class="small-btn danger">🗑️ Delete</button>
  </div>
</div>

<!-- ================= START ================= -->
<div id="screen-start" class="screen">
  <button id="backBtn" class="back-btn" aria-label="Back to brushers">←</button>
  <div id="startAvatar" class="avatar-circle"></div>
  <h1 id="readyText">Toothbrush Time!</h1>
  <p class="subtitle">2 minutes = super sparkly teeth ✨</p>
  <button id="startBtn" class="big-btn">Start Brushing!</button>
</div>

<!-- ================= BRUSHING ================= -->
<div id="screen-brush" class="screen">
  <div id="brushHeader">
    <div id="timerWrap">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <circle id="ringBg" cx="50" cy="50" r="44"/>
        <circle id="ringFg" cx="50" cy="50" r="44"/>
      </svg>
      <div id="timeText">2:00</div>
    </div>
    <div id="message">
      <div id="msgQuad">Top Right ↗️</div>
      <div id="msgSurface">🪥 Outside</div>
    </div>
  </div>

  <div id="mouthBox">
    <svg id="mouthSvg" viewBox="0 0 440 430" aria-label="Cartoon face showing which teeth to brush">
      <defs>
        <pattern id="plaquePat" width="12" height="12" patternUnits="userSpaceOnUse">
          <rect width="12" height="12" fill="#e6d5a2"/>
          <circle cx="3" cy="4" r="1.9" fill="#d3ba79"/>
          <circle cx="9" cy="9" r="1.5" fill="#dbc68c"/>
        </pattern>
        <radialGradient id="glowGrad">
          <stop offset="0%" stop-color="#fff4c2" stop-opacity=".55"/>
          <stop offset="100%" stop-color="#fff4c2" stop-opacity="0"/>
        </radialGradient>
        <clipPath id="eyeClip"><circle cx="0" cy="0" r="30"/></clipPath>
      </defs>

      <!-- head + cheeks -->
      <ellipse cx="220" cy="220" rx="206" ry="203" fill="#ffd9b0" stroke="#f0b98a" stroke-width="4"/>
      <ellipse cx="62" cy="178" rx="30" ry="20" fill="#ff9ab0" opacity=".55"/>
      <ellipse cx="378" cy="178" rx="30" ry="20" fill="#ff9ab0" opacity=".55"/>

      <!-- eyes -->
      <g transform="translate(148,96)">
        <circle class="eye-white" r="30" fill="#ffffff" stroke="#e8c49b" stroke-width="2"/>
        <g class="eye-ball" clip-path="url(#eyeClip)">
          <circle cx="0" cy="4" r="14" fill="#24425c"/>
          <circle cx="6" cy="-3" r="5" fill="#ffffff" opacity=".9"/>
          <ellipse class="lid" cx="0" cy="-66" rx="32" ry="32" fill="#ffd9b0"/>
        </g>
        <path class="eye-happy" d="M-18 6 Q0 -14 18 6" fill="none" stroke="#24425c" stroke-width="6" stroke-linecap="round"/>
      </g>
      <g transform="translate(292,96)">
        <circle class="eye-white" r="30" fill="#ffffff" stroke="#e8c49b" stroke-width="2"/>
        <g class="eye-ball" clip-path="url(#eyeClip)">
          <circle cx="0" cy="4" r="14" fill="#24425c"/>
          <circle cx="6" cy="-3" r="5" fill="#ffffff" opacity=".9"/>
          <ellipse class="lid" cx="0" cy="-66" rx="32" ry="32" fill="#ffd9b0"/>
        </g>
        <path class="eye-happy" d="M-18 6 Q0 -14 18 6" fill="none" stroke="#24425c" stroke-width="6" stroke-linecap="round"/>
      </g>
      <path class="brow" d="M118 54 Q148 38 178 54" fill="none" stroke="#c98b53" stroke-width="8" stroke-linecap="round"/>
      <path class="brow" d="M262 54 Q292 38 322 54" fill="none" stroke="#c98b53" stroke-width="8" stroke-linecap="round"/>

      <!-- mouth: lips, then the dark opening -->
      <ellipse cx="220" cy="278" rx="180" ry="136" fill="#ff6b8a"/>
      <ellipse cx="220" cy="278" rx="158" ry="112" fill="#5e1b31"/>
      <!-- tongue (behind everything in the mouth) -->
      <path d="M124 322 Q220 268 316 322 Q310 372 220 376 Q130 372 124 322 Z" fill="#e2557b"/>
      <path d="M220 300 Q220 336 220 366" stroke="#c73e63" stroke-width="5" fill="none" stroke-linecap="round"/>

      <!-- brush parks here while brushing the INSIDE surfaces (behind the teeth) -->
      <g id="brushBack"></g>
      <!-- teeth quadrants: screen position matches the child's mirror view -->
      <g id="teeth">
        <g id="quad-ur" class="quad"></g>
        <g id="quad-ul" class="quad"></g>
        <g id="quad-ll" class="quad"></g>
        <g id="quad-lr" class="quad"></g>
      </g>
      <!-- gums drawn over the teeth so the crowns tuck under the gum line -->
      <g id="gums"></g>
      <g id="stars"></g>
      <!-- brush parks here for outer + chewing surfaces (in front of the teeth) -->
      <g id="brushFront">
        <!-- toothbrush: bristle-pad centre sits at this group's origin -->
        <g id="brush">
          <g id="brushInner">
            <g transform="translate(28, 16)">
              <rect x="0" y="-9" width="120" height="18" rx="9" fill="#4aa3ff"/>
              <rect x="0" y="-9" width="24" height="18" rx="9" fill="#2e86e0"/>
              <rect x="-60" y="-8" width="64" height="16" rx="8" fill="#ffffff" stroke="#cdd9e5" stroke-width="2"/>
              <g fill="#7ed957">
                <rect class="bristle" x="-56" y="-24" width="7" height="16" rx="3" style="animation-delay:0s"/>
                <rect class="bristle" x="-46" y="-24" width="7" height="16" rx="3" style="animation-delay:.05s"/>
                <rect class="bristle" x="-36" y="-24" width="7" height="16" rx="3" style="animation-delay:.1s"/>
                <rect class="bristle" x="-26" y="-24" width="7" height="16" rx="3" style="animation-delay:.15s"/>
                <rect class="bristle" x="-16" y="-24" width="7" height="16" rx="3" style="animation-delay:.2s"/>
                <rect class="bristle" x="-6"  y="-24" width="7" height="16" rx="3" style="animation-delay:.25s"/>
              </g>
            </g>
          </g>
        </g>
      </g>
      <g id="fx"></g>
    </svg>
  </div>

  <div id="progressRow">
    <div class="prog" data-q="0">🦷</div>
    <div class="prog" data-q="1">🦷</div>
    <div class="prog" data-q="2">🦷</div>
    <div class="prog" data-q="3">🦷</div>
  </div>

  <div id="pauseOverlay">
    <h2>⏸️ Paused</h2>
    <p>Tap anywhere to keep brushing!</p>
    <button id="restartBtn" class="small-btn">↩️ Start over</button>
    <button id="quitBtn" class="small-btn">🏠 Back to start</button>
  </div>
</div>

<!-- ================= CELEBRATION ================= -->
<div id="screen-done" class="screen">
  <div id="confetti"></div>
  <svg id="doneTooth" viewBox="0 0 120 120" aria-hidden="true">
    <path d="M60 8 C34 8 20 26 20 46 c0 16 6 24 10 40 c3 12 5 26 14 26 c10 0 6-22 16-22 s6 22 16 22 c9 0 11-14 14-26 c4-16 10-24 10-40 C100 26 86 8 60 8 Z"
          fill="#ffffff" stroke="#cdd9e5" stroke-width="4"/>
    <path d="M38 44 l4 9 9 4 -9 4 -4 9 -4-9 -9-4 9-4 Z" fill="#ffd93d"/>
    <path d="M82 44 l4 9 9 4 -9 4 -4 9 -4-9 -9-4 9-4 Z" fill="#ffd93d"/>
    <path d="M42 66 Q60 84 78 66" fill="none" stroke="#24425c" stroke-width="4" stroke-linecap="round"/>
    <path d="M14 14 l2.5 6 6 2.5 -6 2.5 -2.5 6 -2.5-6 -6-2.5 6-2.5 Z" fill="#7fd8f7"/>
    <path d="M102 96 l2.5 6 6 2.5 -6 2.5 -2.5 6 -2.5-6 -6-2.5 6-2.5 Z" fill="#7fd8f7"/>
  </svg>
  <h1>All clean! 🎉</h1>
  <p class="subtitle" id="doneSubtitle">Amazing brushing, superstar!</p>
  <button id="againBtn" class="big-btn">Brush again</button>
</div>

<script>
(() => {
  'use strict';

  // ------- config -------
  const QUAD_SECONDS = 30;
  const SURFACE_SECONDS = 10;          // outside / inside / chewing tops
  const TOTAL_SECONDS = QUAD_SECONDS * 4;
  // ?speed=10 makes time run 10x faster (for testing)
  const SPEED = Math.max(0.1, parseFloat(new URLSearchParams(location.search).get('speed')) || 1);

  // Standard dental sequence, shown mirror-style (child's right = screen right)
  const QUADS = [
    { id: 'quad-ur', label: 'Top Right ↗️',    upper: true,  flip: 1  },
    { id: 'quad-ul', label: 'Top Left ↖️',     upper: true,  flip: -1 },
    { id: 'quad-ll', label: 'Bottom Left ↙️',  upper: false, flip: -1 },
    { id: 'quad-lr', label: 'Bottom Right ↘️', upper: false, flip: 1  },
  ];
  const SURFACES = [
    { label: '🪥 Outside the teeth' },
    { label: '✨ Inside the teeth' },
    { label: '😬 Chewing tops' },
  ];

  // ------- elements -------
  const $ = id => document.getElementById(id);
  const screens = {
    users: $('screen-users'),
    edituser: $('screen-edituser'),
    start: $('screen-start'),
    brush: $('screen-brush'),
    done: $('screen-done'),
  };
  const ringFg = $('ringFg'), timeText = $('timeText');
  const msgQuad = $('msgQuad'), msgSurface = $('msgSurface');
  const brushEl = $('brush');
  const mouthSvg = $('mouthSvg');
  const pauseOverlay = $('pauseOverlay');
  const progs = [...document.querySelectorAll('.prog')];
  const RING_LEN = 2 * Math.PI * 44;
  ringFg.style.strokeDasharray = RING_LEN;

  // ------- mouth geometry -------
  const SVG_NS = 'http://www.w3.org/2000/svg';
  const svgEl = (n, attrs) => {
    const e = document.createElementNS(SVG_NS, n);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  };
  const lerp = (a, b, t) => a + (b - a) * t;

  const MOUTH_CX = 220, CAV_CY = 278, CAV_RX = 158, CAV_RY = 112;
  const N_TEETH = 5;                              // per quadrant, index 0 = front centre
  const TOOTH_KIND = ['incisor', 'incisor', 'canine', 'premolar', 'molar'];
  const TOOTH_W    = [34, 30, 28, 30, 34];
  const UPPER_H    = [52, 46, 44, 38, 34];
  const LOWER_H    = [44, 40, 38, 34, 30];
  // tooth centres, running outward from the midline
  const TOOTH_OFF = (() => {
    const out = [];
    let edge = 0;
    for (let i = 0; i < N_TEETH; i++) { out.push(edge + TOOTH_W[i] / 2); edge += TOOTH_W[i]; }
    return out;
  })();
  // gum line follows the oval mouth opening, so back teeth sit further in
  function archHalf(off) {
    const k = Math.min(1, off / CAV_RX);
    return CAV_RY * Math.sqrt(Math.max(0, 1 - k * k)) - 3;
  }

  // Tooth silhouette. s = +1 for upper (biting edge below the gum), -1 for lower.
  function toothPath(kind, cx, rootY, w, h, s) {
    const hw = w / 2, rw = hw * 0.94;
    const edgeY = rootY + s * h;
    const shoulder = rootY + s * h * 0.55;
    let d = `M${cx - rw} ${rootY} L${cx - hw} ${shoulder} `;
    if (kind === 'canine') {
      d += `Q${cx - hw} ${edgeY - s * 5} ${cx - hw * 0.5} ${edgeY - s * 7} `;
      d += `Q${cx} ${edgeY + s * 9} ${cx + hw * 0.5} ${edgeY - s * 7} `;
      d += `Q${cx + hw} ${edgeY - s * 5} ${cx + hw} ${shoulder} `;
    } else if (kind === 'premolar' || kind === 'molar') {
      const n = kind === 'molar' ? 3 : 2;         // chewing cusps
      const segW = w / n;
      d += `Q${cx - hw} ${edgeY - s * 3} ${cx - hw} ${edgeY - s * 6} `;
      for (let k = 0; k < n; k++) {
        const x0 = cx - hw + k * segW;
        d += `Q${x0 + segW / 2} ${edgeY + s * 7} ${x0 + segW} ${edgeY - s * 6} `;
      }
      d += `Q${cx + hw} ${edgeY - s * 3} ${cx + hw} ${shoulder} `;
    } else {                                       // incisor: flat edge, rounded corners
      d += `Q${cx - hw} ${edgeY} ${cx - hw * 0.6} ${edgeY} `;
      d += `L${cx + hw * 0.6} ${edgeY} `;
      d += `Q${cx + hw} ${edgeY} ${cx + hw} ${shoulder} `;
    }
    return d + `L${cx + rw} ${rootY} Z`;
  }

  // ------- build the teeth, gums and quadrant glows -------
  const teeth = [];        // teeth[quadrant][i] = { plaque, x, crownY, edgeY, level }
  const stars = [];

  function buildQuad(q, qi) {
    const g = $(q.id);
    const s = q.upper ? 1 : -1;
    const row = [];
    for (let i = 0; i < N_TEETH; i++) {
      const cx = MOUTH_CX + q.flip * TOOTH_OFF[i];
      const h = (q.upper ? UPPER_H : LOWER_H)[i];
      const rootY = CAV_CY - s * archHalf(TOOTH_OFF[i]);
      const d = toothPath(TOOTH_KIND[i], cx, rootY, TOOTH_W[i], h, s);
      g.appendChild(svgEl('path', { d, class: 'tooth' }));
      g.appendChild(svgEl('ellipse', {                       // gloss highlight
        class: 'tooth-shine',
        cx: cx - TOOTH_W[i] * 0.2, cy: rootY + s * h * 0.34,
        rx: TOOTH_W[i] * 0.13, ry: h * 0.15,
      }));
      const plaque = svgEl('path', { d, class: 'plaque' });  // scrubbed away as he brushes
      g.appendChild(plaque);
      g.appendChild(svgEl('path', { d, class: 'tooth-outline' }));
      row.push({
        plaque, x: cx, rootY,
        crownY: rootY + s * h * 0.52,
        edgeY: rootY + s * h,
        level: 0,
      });
    }
    teeth[qi] = row;

    // soft glow marking the active quadrant
    const xs = row.map(t => t.x), ys = row.map(t => t.crownY);
    g.insertBefore(svgEl('ellipse', {
      class: 'quad-glow',
      cx: (Math.min(...xs) + Math.max(...xs)) / 2,
      cy: (Math.min(...ys) + Math.max(...ys)) / 2,
      rx: (Math.max(...xs) - Math.min(...xs)) / 2 + 46,
      ry: 58,
    }), g.firstChild);

    // gum band: a thick rounded stroke tucked over the tooth roots.
    // Starts at the midline so the left and right bands meet without a notch.
    const pts = [`${MOUTH_CX} ${(CAV_CY - s * (archHalf(0) + 7)).toFixed(1)}`]
      .concat(row.map(t => `${t.x} ${(t.rootY - s * 7).toFixed(1)}`));
    $('gums').appendChild(svgEl('path', {
      d: 'M' + pts.join(' L'),
      fill: 'none', stroke: '#f2879f', 'stroke-width': 30,
      'stroke-linecap': 'round', 'stroke-linejoin': 'round',
    }));

    const star = svgEl('text', {
      x: (Math.min(...xs) + Math.max(...xs)) / 2,
      y: q.upper ? CAV_CY - CAV_RY - 6 : CAV_CY + CAV_RY + 30,
      'text-anchor': 'middle', class: 'quad-star',
    });
    star.textContent = '⭐';
    $('stars').appendChild(star);
    stars[qi] = star;
  }
  QUADS.forEach(buildQuad);

  // ------- effects: pooled foam, bubbles and sparkles (no per-frame DOM churn) -------
  const fxLayer = $('fx');
  function makePool(n, factory) {
    const pool = [];
    for (let i = 0; i < n; i++) { const e = factory(); fxLayer.appendChild(e); pool.push(e); }
    return pool;
  }
  const foamPool = makePool(20, () => svgEl('circle', { r: 7, fill: '#ffffff', opacity: 0 }));
  const bubblePool = makePool(8, () => svgEl('circle', {
    r: 8, fill: 'rgba(255,255,255,.25)', stroke: '#ffffff', 'stroke-width': 2, opacity: 0,
  }));
  const sparkPool = makePool(10, () => svgEl('path', {
    d: 'M0 -10 L2.8 -2.8 L10 0 L2.8 2.8 L0 10 L-2.8 2.8 L-10 0 L-2.8 -2.8 Z',
    fill: '#fff6b8', opacity: 0,
  }));
  let foamI = 0, bubbleI = 0, sparkI = 0;

  function play(e, frames, opts) {
    if (e._anim) e._anim.cancel();
    e._anim = e.animate(frames, opts);
  }
  function spawnFoam(x, y) {
    const e = foamPool[foamI = (foamI + 1) % foamPool.length];
    const dx = (Math.random() - 0.5) * 26, dy = -8 - Math.random() * 18;
    e.setAttribute('r', (4 + Math.random() * 5).toFixed(1));
    play(e, [
      { transform: `translate(${x}px,${y}px) scale(.35)`, opacity: 0.85 },
      { transform: `translate(${x + dx}px,${y + dy}px) scale(1)`, opacity: 0 },
    ], { duration: 700 + Math.random() * 400, easing: 'ease-out' });
  }
  function spawnBubble(x, y) {
    const e = bubblePool[bubbleI = (bubbleI + 1) % bubblePool.length];
    const dx = (Math.random() - 0.5) * 50, rise = 70 + Math.random() * 50;
    e.setAttribute('r', (5 + Math.random() * 5).toFixed(1));
    play(e, [
      { transform: `translate(${x}px,${y}px) scale(.4)`, opacity: 0 },
      { transform: `translate(${x + dx * 0.4}px,${y - rise * 0.45}px) scale(1)`, opacity: 0.75, offset: 0.35 },
      { transform: `translate(${x + dx}px,${y - rise}px) scale(1.1)`, opacity: 0 },
    ], { duration: 2200 + Math.random() * 900, easing: 'ease-out' });
  }
  function spawnSparkle(x, y) {
    const e = sparkPool[sparkI = (sparkI + 1) % sparkPool.length];
    play(e, [
      { transform: `translate(${x}px,${y}px) scale(.2) rotate(0deg)`, opacity: 0 },
      { transform: `translate(${x}px,${y - 6}px) scale(1.1) rotate(70deg)`, opacity: 1, offset: 0.4 },
      { transform: `translate(${x}px,${y - 16}px) scale(.5) rotate(140deg)`, opacity: 0 },
    ], { duration: 850, easing: 'ease-out' });
  }

  // ------- plaque bookkeeping -------
  // A tooth only becomes fully clean once all three surfaces have been brushed.
  function resetTeeth() {
    teeth.forEach(row => row.forEach(t => { t.level = 0; t.plaque.style.opacity = 1; }));
  }
  function cleanTeeth(qi, upTo, level) {
    const row = teeth[qi];
    for (let i = 0; i <= upTo && i < N_TEETH; i++) {
      const t = row[i];
      if (level <= t.level) continue;
      t.level = level;
      t.plaque.style.opacity = (3 - level) / 3;
      spawnFoam(t.x, t.crownY);
      if (level === 3) spawnSparkle(t.x, t.crownY);
    }
  }

  // ------- audio (synthesised, no files) -------
  let audioCtx = null;
  let muted = false;
  try { muted = localStorage.getItem('tt-muted') === '1'; } catch (e) {}
  const muteBtn = $('muteBtn');
  function renderMute() { muteBtn.textContent = muted ? '🔇' : '🔊'; }
  renderMute();
  muteBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    muted = !muted;
    try { localStorage.setItem('tt-muted', muted ? '1' : '0'); } catch (err) {}
    renderMute();
    if (!muted) tone(880, 0, 0.12, 'sine', 0.15);
  });

  function ensureAudio() {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  }
  function tone(freq, when, dur, type = 'sine', gain = 0.2) {
    if (muted || !audioCtx) return;
    const t = audioCtx.currentTime + when;
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g).connect(audioCtx.destination);
    osc.start(t);
    osc.stop(t + dur + 0.05);
  }
  const sfx = {
    start:    () => tone(659, 0, 0.18, 'triangle', 0.22),
    surface:  () => tone(740, 0, 0.15, 'sine', 0.16),
    quadrant: () => { tone(659, 0, 0.16, 'triangle', 0.22); tone(784, 0.14, 0.22, 'triangle', 0.22); },
    fanfare:  () => { [523, 659, 784, 1047].forEach((f, i) => tone(f, i * 0.17, 0.3, 'triangle', 0.24)); },
  };

  // ------- user profiles -------
  const AVATAR_EMOJIS = ['🦁', '🦄', '🤖', '🐸', '🦖', '🚀', '🐱', '🐶', '🐼', '🦊', '🐙', '⚽'];
  const AVATAR_COLORS = ['#ffd93d', '#7fd8f7', '#b8f2c9', '#ffb3c1', '#b28dff', '#ff9f43'];
  let users = [];
  try {
    const stored = JSON.parse(localStorage.getItem('tt-users'));
    if (Array.isArray(stored)) users = stored;
  } catch (e) {}
  function saveUsers() {
    try { localStorage.setItem('tt-users', JSON.stringify(users)); } catch (e) {}
  }
  let currentUser = null;
  let editingId = null;                // null while adding a new user
  let selEmoji = AVATAR_EMOJIS[0];
  let selColor = AVATAR_COLORS[0];
  const nameInput = $('nameInput');

  // long-press opens the editor; a plain tap selects. The capture-phase click
  // handler swallows the click that follows a completed long-press.
  function attachLongPress(el, fn) {
    let timer = null, fired = false;
    el.addEventListener('pointerdown', () => {
      fired = false;
      timer = setTimeout(() => { fired = true; fn(); }, 700);
    });
    ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev =>
      el.addEventListener(ev, () => clearTimeout(timer)));
    el.addEventListener('click', (e) => {
      if (fired) { e.stopImmediatePropagation(); e.preventDefault(); }
    }, true);
    el.addEventListener('contextmenu', e => e.preventDefault());
  }

  function makeAvatar(user) {
    const av = document.createElement('span');
    av.className = 'avatar-circle';
    av.style.background = user.color;
    av.textContent = user.emoji;
    if (user.brushCount > 0) {
      const badge = document.createElement('span');
      badge.className = 'count-badge';
      badge.textContent = '⭐' + user.brushCount;
      av.appendChild(badge);
    }
    return av;
  }

  function renderUsers() {
    const grid = $('userGrid');
    grid.innerHTML = '';
    users.forEach(u => {
      const b = document.createElement('button');
      b.className = 'user-bubble';
      b.appendChild(makeAvatar(u));
      const name = document.createElement('span');
      name.className = 'uname';
      name.textContent = u.name;
      b.appendChild(name);
      attachLongPress(b, () => openEditor(u));
      b.addEventListener('click', () => selectUser(u));
      grid.appendChild(b);
    });
    const plus = document.createElement('button');
    plus.className = 'user-bubble plus-bubble';
    plus.innerHTML = '<span class="avatar-circle">＋</span><span class="uname">Add</span>';
    plus.addEventListener('click', () => openEditor(null));
    grid.appendChild(plus);
    $('usersHint').textContent = users.length
      ? 'Tap your face to start! (Hold it to change it)'
      : 'Tap the + to add a brusher!';
  }

  function renderPickers() {
    const eg = $('emojiGrid'), cg = $('colorGrid');
    eg.innerHTML = '';
    cg.innerHTML = '';
    AVATAR_EMOJIS.forEach(em => {
      const b = document.createElement('button');
      b.className = 'emoji-opt' + (em === selEmoji ? ' selected' : '');
      b.textContent = em;
      b.addEventListener('click', () => { selEmoji = em; renderPickers(); });
      eg.appendChild(b);
    });
    AVATAR_COLORS.forEach(col => {
      const b = document.createElement('button');
      b.className = 'color-opt' + (col === selColor ? ' selected' : '');
      b.style.background = col;
      b.setAttribute('aria-label', 'color ' + col);
      b.addEventListener('click', () => { selColor = col; renderPickers(); });
      cg.appendChild(b);
    });
  }

  function openEditor(user) {
    editingId = user ? user.id : null;
    $('editTitle').textContent = user ? 'Change brusher' : 'New brusher';
    nameInput.value = user ? user.name : '';
    nameInput.placeholder = 'Name';
    selEmoji = user ? user.emoji : AVATAR_EMOJIS[users.length % AVATAR_EMOJIS.length];
    selColor = user ? user.color : AVATAR_COLORS[users.length % AVATAR_COLORS.length];
    renderPickers();
    const del = $('deleteUserBtn');
    del.style.display = user ? '' : 'none';
    del.textContent = '🗑️ Delete';
    del.classList.remove('confirm');
    show('edituser');
  }

  function selectUser(u) {
    currentUser = u;
    ensureAudio();
    const av = $('startAvatar');
    av.textContent = u.emoji;
    av.style.background = u.color;
    $('readyText').textContent = `Ready, ${u.name}?`;
    show('start');
  }

  // ------- wake lock -------
  let wakeLock = null;
  async function requestWakeLock() {
    try { wakeLock = await navigator.wakeLock?.request('screen'); } catch (e) { wakeLock = null; }
  }
  function releaseWakeLock() {
    wakeLock?.release().catch(() => {});
    wakeLock = null;
  }

  // ------- state machine -------
  let state = 'idle';                 // idle | brushing | paused | done
  let elapsed = 0;
  let lastTs = null;
  let curQuad = -1, curSurface = -1;
  let rafId = null;
  let foamTimer = 0, bubbleTimer = 1, cheerTimer = null;

  function show(name) {
    Object.values(screens).forEach(s => s.classList.remove('active'));
    screens[name].classList.add('active');
  }

  // The brush sweeps front-to-back and back again across the quadrant during
  // each surface segment, so every tooth actually gets covered.
  const SWEEPS_PER_SURFACE = 2;
  function sweepU(sp) {
    const p = (sp * SWEEPS_PER_SURFACE) % 1;
    return p < 0.5 ? p * 2 : (1 - p) * 2;
  }

  function brushTarget(qi, si, u) {
    const q = QUADS[qi], row = teeth[qi];
    const s = q.upper ? 1 : -1;
    const f = u * (N_TEETH - 1);
    const i = Math.min(N_TEETH - 2, Math.floor(f));
    const t = Math.min(1, f - i);
    const a = row[i], b = row[i + 1];
    let y, tilt;
    if (si === 2) {                    // chewing tops: flat along the biting edge
      y = lerp(a.edgeY, b.edgeY, t) + s * 16;
      tilt = 0;
    } else {                           // outer / inner faces, angled at the gum line
      y = lerp(a.crownY, b.crownY, t) + (si === 1 ? s * 8 : 0);
      tilt = si === 0 ? 12 : -10;
    }
    return {
      x: lerp(a.x, b.x, t),
      y,
      rot: (q.upper ? 0 : 180) + tilt,
      sx: q.upper ? q.flip : -q.flip,  // keep the handle pointing out of the mouth
    };
  }

  let bx = MOUTH_CX, by = CAV_CY;
  function moveBrush(target, dt) {
    const k = dt ? 1 - Math.exp(-dt * 9) : 1;     // smooth follow, no CSS transition
    bx += (target.x - bx) * k;
    by += (target.y - by) * k;
    brushEl.style.transform =
      `translate(${bx.toFixed(1)}px, ${by.toFixed(1)}px) scale(${target.sx},1) rotate(${target.rot}deg)`;
  }

  function setQuadClasses() {
    QUADS.forEach((q, i) => {
      const done = i < curQuad || state === 'done';
      $(q.id).classList.toggle('active', i === curQuad && state !== 'done');
      stars[i].classList.toggle('on', done);
      progs[i].classList.toggle('active', i === curQuad && state !== 'done');
      progs[i].classList.toggle('done', done);
      progs[i].textContent = done ? '⭐' : '🦷';
    });
  }

  function popText(el, text) {
    el.textContent = text;
    el.classList.remove('pop');
    void el.offsetWidth;               // restart the animation
    el.classList.add('pop');
  }

  function cheer() {                    // brief happy face when a quadrant is finished
    mouthSvg.classList.add('happy');
    clearTimeout(cheerTimer);
    cheerTimer = setTimeout(() => mouthSvg.classList.remove('happy'), 1500);
  }

  function updatePhase() {
    const qi = Math.min(3, Math.floor(elapsed / QUAD_SECONDS));
    const si = Math.min(2, Math.floor((elapsed % QUAD_SECONDS) / SURFACE_SECONDS));
    if (qi !== curQuad) {
      if (curQuad !== -1) { sfx.quadrant(); cheer(); }
      curQuad = qi;
      curSurface = si;
      popText(msgQuad, QUADS[qi].label);
      popText(msgSurface, SURFACES[si].label);
      setQuadClasses();
    } else if (si !== curSurface) {
      curSurface = si;
      sfx.surface();
      popText(msgSurface, SURFACES[si].label);
    }
  }

  // brush position + plaque removal, driven by where we are in the surface segment
  function updateBrushing(dt) {
    const sp = (elapsed % SURFACE_SECONDS) / SURFACE_SECONDS;
    const u = sweepU(sp);
    moveBrush(brushTarget(curQuad, curSurface, u), dt);
    cleanTeeth(curQuad, Math.floor(u * (N_TEETH - 1)), curSurface + 1);

    // the inner surfaces are brushed from behind the teeth
    const layer = curSurface === 1 ? $('brushBack') : $('brushFront');
    if (brushEl.parentNode !== layer) layer.appendChild(brushEl);

    foamTimer -= dt;
    if (foamTimer <= 0) {
      foamTimer = 0.3;
      spawnFoam(bx + (Math.random() - 0.5) * 24, by + (Math.random() - 0.5) * 16);
    }
    bubbleTimer -= dt;
    if (bubbleTimer <= 0) {
      bubbleTimer = 1.3 + Math.random() * 0.9;
      spawnBubble(bx + (Math.random() - 0.5) * 40, by);
    }
  }

  function updateClock() {
    const remaining = Math.max(0, TOTAL_SECONDS - elapsed);
    const shown = Math.ceil(remaining);
    timeText.textContent = `${Math.floor(shown / 60)}:${String(shown % 60).padStart(2, '0')}`;
    ringFg.style.strokeDashoffset = RING_LEN * (elapsed / TOTAL_SECONDS);
  }

  function loop(ts) {
    if (state !== 'brushing') return;
    let dt = 0;
    if (lastTs !== null) {
      dt = Math.min((ts - lastTs) / 1000, 0.5) * SPEED;
      elapsed += dt;
    }
    lastTs = ts;
    if (elapsed >= TOTAL_SECONDS) { finish(); return; }
    updatePhase();
    updateBrushing(dt);
    updateClock();
    rafId = requestAnimationFrame(loop);
  }

  function startBrushing() {
    ensureAudio();
    sfx.start();
    elapsed = 0;
    lastTs = null;
    curQuad = -1;
    curSurface = -1;
    state = 'brushing';
    screens.brush.classList.remove('paused');
    pauseOverlay.classList.remove('show');
    show('brush');
    resetTeeth();
    mouthSvg.classList.remove('happy');
    foamTimer = 0;
    bubbleTimer = 1;
    updatePhase();
    moveBrush(brushTarget(curQuad, curSurface, 0), 0);   // start on the first tooth
    updateClock();
    requestWakeLock();
    cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(loop);
  }

  function pause() {
    if (state !== 'brushing') return;
    state = 'paused';
    cancelAnimationFrame(rafId);
    screens.brush.classList.add('paused');
    pauseOverlay.classList.add('show');
  }

  function resume() {
    if (state !== 'paused') return;
    ensureAudio();
    state = 'brushing';
    lastTs = null;
    screens.brush.classList.remove('paused');
    pauseOverlay.classList.remove('show');
    rafId = requestAnimationFrame(loop);
  }

  function finish() {
    state = 'done';
    cancelAnimationFrame(rafId);
    for (let qi = 0; qi < QUADS.length; qi++) cleanTeeth(qi, N_TEETH - 1, 3);
    setQuadClasses();
    cheer();
    if (currentUser) {
      currentUser.brushCount = (currentUser.brushCount || 0) + 1;
      saveUsers();
      $('doneSubtitle').textContent =
        `That's brush #${currentUser.brushCount}, ${currentUser.name}! ⭐`;
    } else {
      $('doneSubtitle').textContent = 'Amazing brushing, superstar!';
    }
    show('done');
    sfx.fanfare();
    launchConfetti();
    releaseWakeLock();
  }

  function goHome() {
    state = 'idle';
    cancelAnimationFrame(rafId);
    pauseOverlay.classList.remove('show');
    screens.brush.classList.remove('paused');
    renderUsers();
    show('users');
    releaseWakeLock();
  }

  // ------- confetti -------
  const CONFETTI_COLORS = ['#ff6b8a', '#ffd93d', '#7fd8f7', '#7ed957', '#ff9f43', '#b28dff'];
  function launchConfetti() {
    const box = $('confetti');
    box.innerHTML = '';
    for (let i = 0; i < 90; i++) {
      const c = document.createElement('div');
      const emoji = i % 9 === 0;
      c.className = 'confetto ' + (emoji ? 'emoji' : 'square');
      if (emoji) c.textContent = ['⭐', '✨', '🦷', '🪥'][i % 4];
      else c.style.background = CONFETTI_COLORS[i % CONFETTI_COLORS.length];
      c.style.left = Math.random() * 100 + 'vw';
      c.style.animationDuration = (2.2 + Math.random() * 2.5) + 's';
      c.style.animationDelay = (Math.random() * 1.2) + 's';
      box.appendChild(c);
    }
  }

  // ------- events -------
  $('startBtn').addEventListener('click', startBrushing);
  $('againBtn').addEventListener('click', startBrushing);
  $('backBtn').addEventListener('click', goHome);
  $('cancelUserBtn').addEventListener('click', () => { renderUsers(); show('users'); });
  $('saveUserBtn').addEventListener('click', () => {
    const name = nameInput.value.trim();
    if (!name) { nameInput.placeholder = 'Type a name!'; nameInput.focus(); return; }
    if (editingId) {
      const u = users.find(u => u.id === editingId);
      if (u) { u.name = name; u.emoji = selEmoji; u.color = selColor; }
    } else {
      users.push({
        id: Date.now().toString(36) + Math.floor(Math.random() * 1e6).toString(36),
        name, emoji: selEmoji, color: selColor, brushCount: 0,
      });
    }
    saveUsers();
    renderUsers();
    show('users');
  });
  $('deleteUserBtn').addEventListener('click', (e) => {
    const del = e.currentTarget;
    if (!del.classList.contains('confirm')) {
      del.classList.add('confirm');
      del.textContent = 'Really delete?';
      return;
    }
    users = users.filter(u => u.id !== editingId);
    if (currentUser && currentUser.id === editingId) currentUser = null;
    saveUsers();
    renderUsers();
    show('users');
  });
  nameInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') nameInput.blur();
  });
  $('restartBtn').addEventListener('click', (e) => { e.stopPropagation(); startBrushing(); });
  $('quitBtn').addEventListener('click', (e) => { e.stopPropagation(); goHome(); });

  screens.brush.addEventListener('click', () => {
    if (state === 'brushing') pause();
    else if (state === 'paused') resume();
  });

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') {
      if (state === 'brushing') pause();
    } else if (state === 'brushing' || state === 'paused') {
      requestWakeLock();
    }
  });

  renderUsers();
})();
</script>
</body>
</html>
